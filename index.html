<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FBU Torneos" />
    <link rel="apple-touch-icon" href="/icons/icon-152.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png" />
    <script>
      /* La portada web se instala como app aparte ("FEBIU Web"), con su propio icono y su propia direccion de inicio. */
      if (location.pathname.indexOf('/portada') === 0) {
        document.querySelector('link[rel="manifest"]').setAttribute('href', '/manifest-web.json');
        document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', '/icons/web-152.png');
        document.querySelector('link[rel="icon"]').setAttribute('href', '/icons/web-96.png');
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', 'FEBIU Web');
      }
    </script>
    <title>FBU Torneos — Federación de Billar del Uruguay</title>
    <meta name="description" content="Resultados en vivo, partidos y rankings de los torneos de billar de la FEBIU." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FBU Torneos" />
    <meta property="og:title" content="FBU Torneos — Federación de Billar del Uruguay" />
    <meta property="og:description" content="Resultados en vivo, partidos y rankings de los torneos de billar de la FEBIU." />
    <meta property="og:url" content="https://www.febiu.org/" />
    <meta property="og:image" content="https://www.febiu.org/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registrado:', reg.scope))
            .catch(err => console.log('SW error:', err));
        });
      }
    </script>
  </body>
</html>
